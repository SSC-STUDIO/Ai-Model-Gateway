routing:
    cache:
        enabled: false
        max_entries: 1000
        ttl_seconds: 300
    compression:
        level: 5
        min_size_bytes: 1024
    failure_policy:
        cooldown_sec: 60
        disable_cooldown: false
        passthrough_after_sec: 600
        quota_recovery_interval_min: 0
        threshold: 20
    health:
        enabled: true
        interval_sec: 30
        path: /v1/models
        timeout_ms: 5000
    intercepts: []
    key_rotation:
        enabled: false
    max_retries: 3
    queue:
        high_priority_pct: 60
        max_concurrent: 100
    rate_limit:
        burst: 0
        enabled: false
        requests_per_second: 0
    retry:
        all_errors: false
        infinite_on_error: false
        message_keywords:
            - too many requests
            - rate limit
            - quota exceeded
            - stream disconnected before completion
            - stream closed before response.completed
            - upstream request failed
            - server busy
            - system busy
            - temporarily unavailable
            - temporarily overloaded
            - overloaded
            - please try again later
            - service unavailable
            - connection reset
            - connection refused
            - gateway error
        status_code_min: 500
        status_codes:
            - 408
            - 429
    retry_backoff:
        initial_ms: 3000
        max_ms: 60000
    ssrf:
        allow_localhost: false
        allow_private_ip: false
    sticky_sessions:
        enabled: true
        ttl_sec: 1800
    strategy: health_weighted_rr
server:
    idle_timeout_ms: 120000
    listen: :18080
    max_body_bytes: 1.048576e+08
    read_timeout_ms: 30000
    write_timeout_ms: 0
telemetry:
    aggregation_sec: 60
    cache_ttl_sec: 5
    retention_days: 30
    sqlite_path: configs\data\telemetry.db
