# AI Model Gateway - Docker configuration
# This is a Linux-adapted copy of config.yaml with:
#   - Forward-slash paths (no Windows backslashes)
#   - Environment variable references for secrets (loaded from secrets.env)
#
# The Go binary resolves ${VAR} from environment at parse time.

admin:
    bootstrap_token: ${ADMIN_BOOTSTRAP_TOKEN}
    cookie_signing_key: ${COOKIE_SIGNING_KEY}
    enabled: true
    language: zh
    publish_history_limit: 256
    rate_limit:
        burst: 20
        requests_per_second: 10
    tokens:
        - name: admin
          role: admin
          token: ${ADMIN_TOKEN}
        - name: viewer
          role: viewer
          token: ${VIEWER_TOKEN}
benchmarking:
    aliases: []
    default_suite: general_protocol_v1
    enabled: false
    judge:
        provider: ""
        public_model: ""
        timeout_ms: 30000
    limits:
        max_parallel_cases: 2
        max_parallel_runs: 1
        per_case_timeout_ms: 30000
    verdict_thresholds:
        high_suspect_protocol_failures: 2
        normal_max_gap: 8
        suspect_max_gap: 20
compat:
    bridge:
        enabled: true
        exclude_user_agents: []
        rules:
            - from: '*mimo*'
              to: mimo-v2.5
    fallback:
        detect_repetition: false
        enabled: false
        models: {}
pricing:
    cache_path: configs/data/pricing-cache.json
    fx:
        cache_path: configs/data/pricing-fx-cache.json
        enabled: true
        refresh_interval_minutes: 1440
    manual_prices: []
    refresh_interval_hours: 1
    request_timeout_ms: 15000
    sources:
        - enabled: true
          id: openai
          refresh_interval_minutes: 15
          timeout_ms: 15000
          url: https://openai.com/api/pricing/
          vendor: openai
        - enabled: true
          id: anthropic
          refresh_interval_minutes: 15
          timeout_ms: 15000
          url: https://docs.anthropic.com/en/docs/about-claude/pricing
          vendor: anthropic
        - enabled: true
          id: gemini
          refresh_interval_minutes: 15
          timeout_ms: 15000
          url: https://ai.google.dev/gemini-api/docs/pricing
          vendor: gemini
        - enabled: true
          id: moonshot
          refresh_interval_minutes: 15
          timeout_ms: 15000
          url: https://platform.moonshot.cn/docs/pricing/chat
          vendor: moonshot
        - enabled: true
          id: zhipu
          refresh_interval_minutes: 15
          timeout_ms: 15000
          url: https://open.bigmodel.cn/pricing
          vendor: zhipu
        - enabled: true
          id: minimax
          refresh_interval_minutes: 15
          timeout_ms: 15000
          url: https://platform.minimaxi.com/docs/pricing
          vendor: minimax
        - enabled: true
          id: deepseek
          refresh_interval_minutes: 15
          timeout_ms: 15000
          url: https://api-docs.deepseek.com/quick_start/pricing
          vendor: deepseek
        - enabled: true
          id: xai
          refresh_interval_minutes: 15
          timeout_ms: 15000
          url: https://x.ai/api
          vendor: xai
        - enabled: true
          id: step
          refresh_interval_minutes: 15
          timeout_ms: 15000
          url: https://platform.stepfun.com/docs/pricing
          vendor: step
        - enabled: false
          id: xiaomi
          refresh_interval_minutes: 15
          timeout_ms: 15000
          url: https://platform.xiaomi.com/
          vendor: xiaomi
providers:
    - anthropic_base_url: ""
      api_key: ${OPENCODE_API_KEY}
      base_url: https://opencode.ai/zen/go
      enabled: false
      fallback_models: []
      headers: {}
      model_aliases:
        mimo-v2.5: deepseek-v4-flash
      models:
        - deepseek-v4-pro
        - deepseek-v4-flash
        - mimo-v2.5
      name: opencode-deepseek
      protocol_adapter: openai_chat_completions
      provider_class: quota_limited
      rate_limit:
        burst: 0
        enabled: false
        requests_per_second: 0
      same_retries: 1
      timeout_ms: 300000
      weight: 2
    - anthropic_base_url: ""
      api_key: ${OTHERSAPI_API_KEY}
      base_url: https://othersapi.com
      enabled: true
      fallback_models: []
      headers: {}
      model_aliases:
        deepseek-v4-flash: glm-5.2
        deepseek-v4-pro: glm-5.2
        mimo-v2.5: glm-5.2
      models:
        - minimax-m3
        - deepseek-v4-flash
        - glm-5.2
        - mimo-v2.5
      name: othersapi-kimi
      protocol_adapter: openai_chat_completions
      provider_class: quota_limited
      rate_limit:
        burst: 0
        enabled: false
        requests_per_second: 0
      same_retries: 1
      timeout_ms: 120000
      weight: 13
    - anthropic_base_url: ""
      api_key: ${MIMO_API_KEY}
      base_url: https://token-plan-cn.xiaomimimo.com
      enabled: true
      fallback_models: []
      headers: {}
      model_aliases: {}
      models:
        - mimo-v2.5
        - mimo-v2.5-pro
      name: xiaomi-mimo
      protocol_adapter: openai_chat_completions
      provider_class: quota_limited
      rate_limit:
        burst: 0
        enabled: false
        requests_per_second: 0
      same_retries: 1
      timeout_ms: 300000
      weight: 3
routing:
    cache:
        enabled: false
        max_entries: 1000
        ttl_seconds: 300
    compression:
        level: 5
        min_size_bytes: 1024
    failure_policy:
        cooldown_sec: 60
        disable_cooldown: true
        passthrough_after_sec: 600
        quota_recovery_interval_min: 0
        threshold: 20
    health:
        enabled: false
        interval_sec: 30
        path: /v1/models
        timeout_ms: 15000
    intercepts:
        - action: retry
          enabled: true
          message_keywords:
            - no provider available
          name: ""
          paths: []
          status_code_min: null
          status_codes:
            - 502
    key_rotation:
        enabled: false
    max_retries: 3
    queue:
        high_priority_pct: 60
        max_concurrent: 100
    rate_limit:
        burst: 0
        enabled: false
        requests_per_second: 0
    retry:
        all_errors: false
        infinite_on_error: true
        message_keywords:
            - too many requests
            - rate limit
            - quota exceeded
            - stream disconnected before completion
            - stream closed before response.completed
            - upstream request failed
            - server busy
            - system busy
            - temporarily unavailable
            - temporarily overloaded
            - overloaded
            - please try again later
            - service unavailable
            - connection reset
            - connection refused
            - gateway error
        status_code_min: 500
        status_codes:
            - 408
            - 429
    retry_backoff:
        initial_ms: 3000
        max_ms: 60000
    ssrf:
        allow_localhost: false
        allow_private_ip: false
    sticky_sessions:
        enabled: true
        ttl_sec: 1800
    strategy: health_weighted_rr
server:
    idle_timeout_ms: 900000
    listen: ":18080"
    max_body_bytes: 1.048576e+08
    read_timeout_ms: 30000
    write_timeout_ms: 0
telemetry:
    aggregation_sec: 60
    cache_ttl_sec: 5
    retention_days: 30
    sqlite_path: configs/data/telemetry.db
