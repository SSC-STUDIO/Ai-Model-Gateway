# AI-Model-Gateway Configuration
# Copy this file to configs/config.yaml and replace placeholder values.

server:
  listen: :18080
  read_timeout_ms: 30000
  write_timeout_ms: 0
  idle_timeout_ms: 120000
  max_body_bytes: 104857600

admin:
  enabled: true
  bootstrap_token: "${ADMIN_BOOTSTRAP_TOKEN}"
  cookie_signing_key: "${COOKIE_SIGNING_KEY}"
  publish_history_limit: 256
  language: zh
  tokens:
    - name: admin
      token: "${ADMIN_TOKEN}"
      role: admin
    - name: viewer
      token: "${VIEWER_TOKEN}"
      role: viewer
  rate_limit:
    requests_per_second: 10
    burst: 20

routing:
  strategy: health_weighted_rr
  max_retries: 2
  retry_backoff:
    initial_ms: 3000
    max_ms: 30000
  health:
    enabled: true
    interval_sec: 10
    timeout_ms: 2000
    path: /v1/models
  sticky_sessions:
    enabled: true
    ttl_sec: 1800
  failure_policy:
    threshold: 20
    cooldown_sec: 60
    passthrough_after_sec: 600
    quota_recovery_interval_min: 0
    disable_cooldown: false
  retry:
    infinite_on_error: false
    all_errors: false
    status_codes:
      - 408
      - 429
    status_code_min: 500
    message_keywords:
      - too many requests
      - rate limit
      - quota exceeded
      - stream disconnected before completion
      - stream closed before response.completed
      - upstream request failed
      - server busy
      - system busy
      - temporarily unavailable
      - temporarily overloaded
      - overloaded
      - please try again later
      - service unavailable
  intercepts: []

  # For clients that must never receive transient upstream 429/504 style errors,
  # enable both switches below:
  # failure_policy:
  #   disable_cooldown: true
  # retry:
  #   infinite_on_error: true
  #   all_errors: true
  # retry_backoff:
  #   initial_ms: 0
  #   max_ms: 0

providers:
  - name: station-a
    base_url: https://example-a.com
    api_key: "${STATION_A_API_KEY}"
    provider_class: free
    models:
      - gpt-4o-mini
      - gpt-4.1-mini
    weight: 5
    timeout_ms: 300000
    same_retries: 0
    enabled: true

  - name: station-b
    base_url: https://example-b.com
    api_key: "${STATION_B_API_KEY}"
    provider_class: quota_limited
    models:
      - gpt-4o-mini
    weight: 1
    timeout_ms: 300000
    same_retries: 0
    enabled: true

  # Example: Provider supporting Anthropic Messages API format
  # When anthropic_base_url is set, /v1/messages requests use this URL
  # and authenticate with x-api-key header instead of Bearer token
  - name: kimi-official
    base_url: https://api.moonshot.cn
    anthropic_base_url: https://api.moonshot.cn/anthropic
    protocol_adapter: anthropic_messages
    api_key: "${KIMI_OFFICIAL_API_KEY}"
    provider_class: quota_limited
    models:
      - kimi-k2.5
    weight: 1
    timeout_ms: 180000
    same_retries: 1
    enabled: true
    headers: {}

telemetry:
  sqlite_path: data/telemetry.db
  retention_days: 30
  aggregation_sec: 60
  cache_ttl_sec: 5

pricing:
  cache_path: data/pricing-cache.json
  refresh_interval_hours: 12
  request_timeout_ms: 15000
  manual_prices:
    - provider: kimi-official
      model: glm-5.1
      currency: CNY
      input_per_1m: 0
      cached_input_per_1m: 0
      output_per_1m: 0
      enabled: false
      source: manual

benchmarking:
  enabled: false
  default_suite: general_protocol_v1
  judge:
    provider: kimi-official
    public_model: kimi-k2.5
    timeout_ms: 30000
  limits:
    max_parallel_runs: 1
    max_parallel_cases: 2
    per_case_timeout_ms: 30000
  verdict_thresholds:
    normal_max_gap: 8
    suspect_max_gap: 20
    high_suspect_protocol_failures: 2
  aliases:
    - canonical_model_id: gpt-4o-mini
      provider: station-a
      models:
        - gpt-4o-mini

compat:
  bridge:
    enabled: false
    exclude_user_agents:
      - "*Codex Desktop*"
    rules:
      - from: gpt-5.2*
        to: gpt-5.4
  fallback:
    enabled: false
    detect_repetition: false
    models: {}
