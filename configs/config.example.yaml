# AI-Model-Gateway Configuration
# Top-level structure: server, admin, routing, providers, telemetry, pricing, compat

server:
  listen: :18080
  read_timeout_ms: 30000
  write_timeout_ms: 60000
  idle_timeout_ms: 120000
  max_body_bytes: 104857600  # 100 MB

admin:
  enabled: true                    # Enable admin for testing
  bootstrap_token: "12345678901234567890123456789012"  # 32 chars
  cookie_signing_key: "abcdef1234567890abcdef1234567890"  # 32 chars
  language: zh
  tokens:
    - name: alice-admin
      token: "your-admin-token-at-least-32-chars-long"
      role: admin
    - name: bob-viewer
      token: "your-viewer-token-at-least-32-chars-long"
      role: viewer
  rate_limit:
    requests_per_second: 10        # Token refill rate (default: 10)
    burst: 20                      # Max burst size (default: 20)

routing:
  strategy: health_weighted_rr
  max_retries: 2
  retry_backoff:
    initial_ms: 3000
    max_ms: 30000
  health:
    enabled: true
    interval_sec: 10
    timeout_ms: 2000
    path: /v1/models          # Provider probe path
  sticky_sessions:
    enabled: true
    ttl_sec: 1800
  failure_policy:
    threshold: 20
    cooldown_sec: 60
    passthrough_after_sec: 600
    quota_recovery_interval_min: 0
  retry:
    infinite_on_error: true
    status_codes:
      - 408
      - 429
    status_code_min: 500
    message_keywords:
      - too many requests
      - rate limit
      - quota exceeded
      - stream disconnected before completion
      - stream closed before response.completed
      - upstream request failed
      - server busy
      - system busy
      - temporarily unavailable
      - temporarily overloaded
      - overloaded
      - please try again later
      - service unavailable
  intercepts: []

# Providers (renamed from upstreams in v1)
providers:
  - name: station-a
    base_url: https://example-a.com
    api_key: sk-xxxx
    provider_class: free
    models:
      - gpt-4o-mini
      - gpt-4.1-mini
    weight: 5
    timeout_ms: 300000
    same_retries: 0
    enabled: true

  - name: station-b
    base_url: https://example-b.com
    api_key: sk-yyyy
    provider_class: quota_limited
    models:
      - gpt-4o-mini
    weight: 1
    timeout_ms: 300000
    same_retries: 0
    enabled: true

  - name: kimi-official
    base_url: https://api.moonshot.cn
    anthropic_base_url: https://api.moonshot.cn/anthropic
    api_key: sk-your-kimi-key
    provider_class: quota_limited
    models:
      - kimi-k2.5
    weight: 1
    timeout_ms: 180000
    same_retries: 1
    enabled: true
    headers: {}

telemetry:
  sqlite_path: data/telemetry.db
  retention_days: 30
  aggregation_sec: 60
  cache_ttl_sec: 5

pricing:
  cache_path: data/pricing-cache.json
  refresh_interval_hours: 12
  request_timeout_ms: 15000

compat:
  bridge:
    enabled: false
    exclude_user_agents:
      - '*Codex Desktop*'
    rules:
      - from: gpt-5.2*
        to: gpt-5.4
  fallback:
    enabled: false            # Optional compatibility fallback layer
    detect_repetition: false
    models: {}
