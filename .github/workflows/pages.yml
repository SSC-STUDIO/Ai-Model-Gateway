name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare site assets
        run: |
          set -euo pipefail
          mkdir -p site/assets
          cp docs/assets/icon.svg site/assets/icon.svg
          cp docs/assets/social-card.png site/assets/social-card.png
          cp docs/assets/admin-overview.png site/assets/admin-overview.png
          cp docs/assets/admin-monitoring.png site/assets/admin-monitoring.png
          cp docs/assets/admin-ops-mobile.png site/assets/admin-ops-mobile.png
          cp docs/assets/admin-benchmark-mobile.png site/assets/admin-benchmark-mobile.png

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
