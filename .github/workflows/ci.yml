name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Go Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(find . -type f -name '*.go' -not -path './.git/*')"
          if [ -n "$files" ]; then
            gofmt -w $files
          fi
          git diff --exit-code

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m

      - name: Run govulncheck
        uses: golang.org/x/vuln/cmd/govulncheck@latest
        with:
          args: ./...

      - name: Reject TODO and FIXME markers
        shell: pwsh
        run: .\scripts\check-no-todo.ps1 -RepoRoot .

      - name: Run tests with coverage
        run: go test -timeout 10m -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: warn

      - name: Verify plane binaries build
        shell: pwsh
        run: |
          go build ./cmd/gatewayd
          go build ./cmd/controld
          go build ./cmd/telemetryd

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/admin/package-lock.json

      - name: Build and test frontend
        shell: bash
        run: |
          cd web/admin
          npm ci
          npm run build
          npm test

      - name: Smoke test direct three-plane startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\verify-default-runtime.ps1

  build-linux:
    name: Build Linux Runtime Bundle
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build current Linux runtime bundle
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o ./dist/gatewayd ./cmd/gatewayd
          go build -trimpath -ldflags="-s -w" -o ./dist/controld ./cmd/controld
          go build -trimpath -ldflags="-s -w" -o ./dist/telemetryd ./cmd/telemetryd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-model-gateway-linux-amd64
          path: dist/
          if-no-files-found: error

  build-windows:
    name: Build Windows Runtime Bundle
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build current Windows runtime bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-s -w" -o .\dist\gatewayd.exe .\cmd\gatewayd
          go build -trimpath -ldflags="-s -w" -o .\dist\controld.exe .\cmd\controld
          go build -trimpath -ldflags="-s -w" -o .\dist\telemetryd.exe .\cmd\telemetryd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-model-gateway-windows-amd64
          path: dist/
          if-no-files-found: error
