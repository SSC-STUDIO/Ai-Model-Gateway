name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Go Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(find . -type f -name '*.go' -not -path './.git/*')"
          if [ -n "$files" ]; then
            gofmt -w $files
          fi
          git diff --exit-code

      - name: Reject TODO and FIXME markers
        shell: pwsh
        run: .\scripts\check-no-todo.ps1

      - name: Run tests
        run: go test -timeout 10m ./...

      - name: Verify default cutover binaries build
        shell: pwsh
        run: |
          go build ./cmd/gateway
          go build ./cmd/gateway-v2
          go build ./cmd/config-convert

  build-windows:
    name: Build Windows Cutover Artifacts
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build default runtime and migration helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-s -w" -o .\dist\gateway.exe .\cmd\gateway
          go build -trimpath -ldflags="-s -w" -o .\dist\gateway-v2.exe .\cmd\gateway-v2
          go build -trimpath -ldflags="-s -w" -o .\dist\config-convert.exe .\cmd\config-convert

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-model-gateway-windows-amd64
          path: dist/
          if-no-files-found: error
