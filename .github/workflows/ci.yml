name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Go Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(find . -type f -name '*.go' -not -path './.git/*')"
          if [ -n "$files" ]; then
            gofmt -w $files
          fi
          git diff --exit-code

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.3
          args: --timeout=5m --new-from-rev=HEAD~10

      - name: Run govulncheck
        shell: bash
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Reject TODO and FIXME markers
        shell: pwsh
        run: .\scripts\check-no-todo.ps1 -RepoRoot .

      - name: Run tests with coverage
        shell: bash
        run: go test -timeout 10m -coverprofile=coverage.out -covermode=atomic ./...

      - name: Enforce coverage threshold
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          threshold=60
          pct=$(go tool cover -func=coverage.out | grep '^total:' | grep -oP '[0-9]+\.[0-9]+' | head -1)
          echo "Total coverage: ${pct}% (threshold: ${threshold}%)"
          if [ "$(printf '%s\n' "$threshold" "$pct" | sort -V | head -1)" != "$threshold" ]; then
            echo "::error::Coverage ${pct}% is below the ${threshold}% threshold"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: warn

      - name: Verify shipped binaries build
        shell: pwsh
        run: |
          go build ./cmd/aigw
          go build ./cmd/gatewayd
          go build ./cmd/controld
          go build ./cmd/telemetryd
          go build ./cmd/gateway-cli

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/admin/package-lock.json

      - name: Build and test frontend
        shell: bash
        run: |
          cd web/admin
          npm ci
          npm run build
          npm test

      - name: Release bundle smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          ADMIN_BOOTSTRAP_TOKEN: 0123456789abcdef0123456789abcdef
          COOKIE_SIGNING_KEY: 0123456789abcdef0123456789abcdef
          ADMIN_TOKEN: 0123456789abcdef0123456789abcdef
          VIEWER_TOKEN: 0123456789abcdef0123456789abcdef
          OPENAI_API_KEY: dummy
          ANTHROPIC_API_KEY: dummy
          STATION_A_API_KEY: dummy
          STATION_B_API_KEY: dummy
          KIMI_OFFICIAL_API_KEY: dummy
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          GIT_COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w -X ai-model-gateway/internal/version.ProductVersion=${VERSION} -X ai-model-gateway/internal/version.BuildCommit=${GIT_COMMIT} -X ai-model-gateway/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          rm -rf dist /tmp/aigw-ci-runtime
          mkdir -p dist/bin
          for bin in aigw gatewayd controld telemetryd gateway-cli; do
            go build -trimpath -ldflags="$LDFLAGS" -o "dist/bin/${bin}" "./cmd/${bin}"
          done
          dist/bin/aigw bundle build -root dist -out dist/aigw-manifest.json
          dist/bin/aigw bundle verify -root dist -manifest dist/aigw-manifest.json
          created_config=0
          if [ ! -f configs/config.yaml ]; then
            cp configs/config.example.yaml configs/config.yaml
            created_config=1
          fi
          dist/bin/aigw supervise \
            -runtime-root /tmp/aigw-ci-runtime \
            -config-dir configs/docker \
            -bin-dir dist/bin \
            -manifest dist/aigw-manifest.json \
            -strict-manifest=true \
            > /tmp/aigw-supervise.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            if [ "$created_config" = "1" ]; then
              rm -f configs/config.yaml
            fi
            cat /tmp/aigw-supervise.log
          }
          trap cleanup EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18081/-/health >/dev/null && curl -fsS http://127.0.0.1:18080/-/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Smoke test direct three-plane startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\verify-default-runtime.ps1

  build-linux:
    name: Build Linux Runtime Bundle
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build current Linux runtime bundle
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          GIT_COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w -X ai-model-gateway/internal/version.ProductVersion=${VERSION} -X ai-model-gateway/internal/version.BuildCommit=${GIT_COMMIT} -X ai-model-gateway/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist/bin
          for bin in aigw gatewayd controld telemetryd gateway-cli; do
            go build -trimpath -ldflags="$LDFLAGS" -o "./dist/bin/${bin}" "./cmd/${bin}"
          done
          dist/bin/aigw bundle build -root dist -out dist/aigw-manifest.json
          dist/bin/aigw bundle verify -root dist -manifest dist/aigw-manifest.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-model-gateway-linux-amd64
          path: dist/
          if-no-files-found: error

  build-windows:
    name: Build Windows Runtime Bundle
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build current Windows runtime bundle
        shell: pwsh
        run: |
          $VERSION = (Get-Content VERSION).Trim()
          $GIT_COMMIT = (git rev-parse --short HEAD).Trim()
          $BUILD_DATE = (Get-Date -AsUTC -Format "yyyy-MM-ddTHH:mm:ssZ")
          $LDFLAGS = "-s -w -X ai-model-gateway/internal/version.ProductVersion=$VERSION -X ai-model-gateway/internal/version.BuildCommit=$GIT_COMMIT -X ai-model-gateway/internal/version.BuildDate=$BUILD_DATE"
          New-Item -ItemType Directory -Force -Path dist\bin | Out-Null
          foreach ($bin in @("aigw", "gatewayd", "controld", "telemetryd", "gateway-cli")) {
            go build -trimpath -ldflags="$LDFLAGS" -o ".\dist\bin\$bin.exe" ".\cmd\$bin"
          }
          .\dist\bin\aigw.exe bundle build -root dist -out dist\aigw-manifest.json
          .\dist\bin\aigw.exe bundle verify -root dist -manifest dist\aigw-manifest.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-model-gateway-windows-amd64
          path: dist/
          if-no-files-found: error

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build --target runtime -t ai-model-gateway:ci .

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/${{ github.repository }}
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag ai-model-gateway:ci "${IMAGE}:main"
          docker push "${IMAGE}:main"
