name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Go Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(find . -type f -name '*.go' -not -path './.git/*')"
          if [ -n "$files" ]; then
            gofmt -w $files
          fi
          git diff --exit-code

      - name: Run tests
        run: go test ./...
