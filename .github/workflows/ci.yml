name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Go Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(find . -type f -name '*.go' -not -path './.git/*')"
          if [ -n "$files" ]; then
            gofmt -w $files
          fi
          git diff --exit-code

      - name: Reject TODO and FIXME markers
        shell: bash
        run: |
          set -euo pipefail
          pattern='(^|[[:space:]])(//|#|/\*+|\*|<!--)[[:space:]]*(FIXME|TODO)\b'
          if git grep -n -I -i -E "$pattern"; then
            echo "Remove TODO/FIXME markers before merging."
            exit 1
          fi

      - name: Run tests
        run: go test ./...

  build-windows:
    name: Build Windows Artifact
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build gateway binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-s -w" -o .\dist\ai-model-gateway-windows-amd64.exe .\cmd\gateway

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-model-gateway-windows-amd64
          path: dist/ai-model-gateway-windows-amd64.exe
          if-no-files-found: error
