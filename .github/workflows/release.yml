name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: windows-latest
            binary: ai-model-gateway-windows-amd64.exe
            archive: ai-model-gateway-windows-amd64.zip
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            binary: ai-model-gateway-linux-amd64
            archive: ai-model-gateway-linux-amd64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.binary }}" ./cmd/gateway

      - name: Package zip
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path ".\dist\${{ matrix.binary }}" -DestinationPath ".\dist\${{ matrix.archive }}" -Force

      - name: Package tar.gz
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "dist/${{ matrix.archive }}" -C dist "${{ matrix.binary }}"

      - name: Upload raw binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.binary }}
            dist/${{ matrix.archive }}
