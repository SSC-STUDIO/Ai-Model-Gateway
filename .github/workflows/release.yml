name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: windows-latest
            gateway_binary: gateway-windows-amd64.exe
            converter_binary: config-convert-windows-amd64.exe
            archive: ai-model-gateway-windows-amd64.zip
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            gateway_binary: gateway-linux-amd64
            converter_binary: config-convert-linux-amd64
            archive: ai-model-gateway-linux-amd64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build default runtime and migration helper
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.gateway_binary }}" ./cmd/gateway
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.converter_binary }}" ./cmd/config-convert

      - name: Package zip
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path ".\dist\${{ matrix.gateway_binary }}", ".\dist\${{ matrix.converter_binary }}" -DestinationPath ".\dist\${{ matrix.archive }}" -Force

      - name: Package tar.gz
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "dist/${{ matrix.archive }}" -C dist "${{ matrix.gateway_binary }}" "${{ matrix.converter_binary }}"

      - name: Upload default runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.gateway_binary }}
          path: dist/${{ matrix.gateway_binary }}

      - name: Upload migration helper artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.converter_binary }}
          path: dist/${{ matrix.converter_binary }}

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.gateway_binary }}
            dist/${{ matrix.converter_binary }}
            dist/${{ matrix.archive }}
