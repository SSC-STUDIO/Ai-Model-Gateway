name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: windows-latest
            archive: ai-model-gateway-windows-amd64.zip
            ext: .exe
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            archive: ai-model-gateway-linux-amd64.tar.gz
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build runtime bundle
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for bin in gatewayd controld telemetryd; do
            go build -trimpath -ldflags="-s -w" -o "dist/${bin}${EXT}" "./cmd/${bin}"
          done

      - name: Package zip
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\* -DestinationPath ".\dist\${{ matrix.archive }}" -Force

      - name: Package tar.gz
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "dist/${{ matrix.archive }}" -C dist .

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-model-gateway-${{ matrix.goos }}-${{ matrix.goarch }}-bundle
          path: dist/

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.archive }}
