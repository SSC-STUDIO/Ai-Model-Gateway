name: Bug report
description: Report a reproducible bug in routing, proxying, telemetry, or the admin UI.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please include enough detail to reproduce the issue without access to your local machine.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: A short description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include request path, model, upstream expectations, and any relevant config shape.
      placeholder: |
        1. Configure ...
        2. Send request to ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact secrets before pasting.
      render: shell
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - routing
        - proxy compatibility
        - monitoring / pricing
        - admin UI
        - config management
        - scripts / packaging
    validations:
      required: true
