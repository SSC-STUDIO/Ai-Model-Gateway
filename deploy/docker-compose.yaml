# AI Model Gateway - unified Docker Compose runtime
#
# Usage:
#   1. Copy secrets:  cp deploy/secrets.env.example deploy/secrets.env
#   2. Edit secrets:  vim deploy/secrets.env   (fill in API keys and admin tokens)
#   3. Start:         docker compose -f deploy/docker-compose.yaml up -d
#   4. Check health:  docker compose -f deploy/docker-compose.yaml ps
#   5. Tail logs:     docker compose -f deploy/docker-compose.yaml logs -f

services:
  aigw:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    container_name: ai-model-gateway
    restart: unless-stopped
    command:
      - supervise
      - -runtime-root
      - /opt/ai-model-gateway/.gateway-runtime
      - -config-dir
      - /opt/ai-model-gateway/configs/docker
      - -bin-dir
      - /opt/ai-model-gateway/bin
      - -manifest
      - /opt/ai-model-gateway/aigw-manifest.json
      - -strict-manifest=true
    ports:
      - "18080:18080" # data plane
      - "18081:18081" # admin/control plane
    volumes:
      - ../configs:/opt/ai-model-gateway/configs:ro
      - aigw-runtime:/opt/ai-model-gateway/.gateway-runtime
    env_file:
      - path: ./secrets.env
        required: false
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:18080/-/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - ai-gateway-net
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M

networks:
  ai-gateway-net:
    driver: bridge
    name: ai-gateway-network

volumes:
  aigw-runtime:
    name: ai-gateway-runtime
