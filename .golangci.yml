# golangci-lint 配置

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters:
  enable:
    # 静态分析
    - staticcheck
    - gosec
    - ineffassign
    - typecheck
    - unused

    # 代码质量
    - gocyclo
    - dupl
    - misspell
    - gofmt
    - goimports

    # 性能
    - prealloc

    # 简化
    - simplify

  disable:
    - exhaustivestruct
    - exhaustruct

linters-settings:
  gocyclo:
    min-complexity: 15

  gofmt:
    simplify: true

  goimports:
    local-prefixes: ai-model-gateway

  gosec:
    excludes:
      - G104  # 审计错误检查
      - G304  # 文件路径检查（配置加载需要）

  misspell:
    locale: US

  dupl:
    threshold: 100

issues:
  exclude-rules:
    # 测试文件允许较低的复杂度
    - path: _test\.go
      linters:
        - gocyclo
        - dupl

    # 生成的文件跳过检查
    - path: generated\.go
      linters:
        - all

  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
