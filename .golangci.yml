version: "2"
run:
  issues-exit-code: 1
  tests: true

linters:
  enable:
    - gocyclo
    - dupl
    - misspell
    - prealloc
    - gosec
  disable:
    - exhaustruct
  settings:
    dupl:
      threshold: 100
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G104
        - G304
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - dupl
      - path: generated\.go
        linters:
          - all
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - ai-model-gateway
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
